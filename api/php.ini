; PHP settings for the Vercel deployment (vercel-php reads this file at build time).
; XAMPP ignores it — use XAMPP's own php.ini there.

; Vercel rejects request bodies over 4.5 MB; config.php keeps uploads under that.
upload_max_filesize = 5M
post_max_size = 5M
max_file_uploads = 10

; uploads are held in memory while they are written to the database
memory_limit = 256M

display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
date.timezone = Asia/Manila
